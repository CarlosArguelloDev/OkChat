# ──────────────────────────────────────────────────────────────────────────────
# OkChat — GitHub Actions CI/CD Pipeline
# Runs on: PR → lint/test | merge main → staging deploy | tag → prod deploy
# ──────────────────────────────────────────────────────────────────────────────

name: CI/CD

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
    tags: ["v*.*.*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/okchat-api
  PYTHON_VERSION: "3.12"

jobs:
  # ── Lint & Type Check ────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install poetry && poetry install --with dev

      - name: Run Ruff (linter + formatter check)
        run: poetry run ruff check src/ tests/

      - name: Run MyPy (type checker)
        run: poetry run mypy src/

      - name: Run pip-audit (security scan)
        run: poetry run pip-audit

  # ── Unit Tests ────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install poetry && poetry install --with dev

      - name: Run unit tests
        run: poetry run pytest tests/unit/ -v --cov=src --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml

  # ── Integration Tests ─────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: okchat
          POSTGRES_PASSWORD: okchat
          POSTGRES_DB: okchat_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OKCHAT_DB__URL: postgresql+asyncpg://okchat:okchat@localhost:5432/okchat_test
      OKCHAT_REDIS__URL: redis://localhost:6379/0
      OKCHAT_AUTH__SECRET_KEY: test-secret-key
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install poetry && poetry install --with dev

      - name: Run Alembic migrations
        run: poetry run alembic upgrade head

      - name: Run integration tests
        run: poetry run pytest tests/integration/ -v

  # ── Build & Push Docker Image ─────────────────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to Staging ─────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Deploy to staging cluster
        run: |
          echo "Deploying ${{ needs.build.outputs.image-tag }} to staging"
          # kubectl set image deployment/okchat-api api=${{ needs.build.outputs.image-tag }}
          # kubectl rollout status deployment/okchat-api --timeout=300s

  # ── Deploy to Production ───────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - name: Deploy to production cluster
        run: |
          echo "Deploying ${{ needs.build.outputs.image-tag }} to production"
          # kubectl set image deployment/okchat-api api=${{ needs.build.outputs.image-tag }}
          # kubectl rollout status deployment/okchat-api --timeout=600s
